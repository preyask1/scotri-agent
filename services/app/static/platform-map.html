<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Platform Map</title>
<!--
  Shell for the platform map (tools/platform_map), served unauthenticated at /platform-map like the
  admin panel: it holds no data. It asks for a bearer token (kept in this tab's session storage
  only), fetches /v1/platform-map with it and replaces itself with the page that comes back.
-->
<style>
:root{--bg:#f4f6f9;--surface:#fff;--ink:#16202c;--muted:#566275;--line:#d8dee7;--accent:#1d5fc4;--bad:#a3261f}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--surface:#161d27;--ink:#e6ebf2;--muted:#9aa6b8;--line:#2a3443;--accent:#6fa6ff;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(460px,100%);display:grid;gap:12px}
h1{font-size:20px;margin:0}
p{margin:0;color:var(--muted)}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
button{font:600 14px "Segoe UI",system-ui,sans-serif;padding:8px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{min-height:1.5em}
#msg.bad{color:var(--bad)}
</style>
</head>
<body>
<main class="box">
  <h1>Data Platform Map</h1>
  <p id="intro">It lists internal workspaces, factories and tenants, so it needs a Scotri sign-in.</p>
  <form id="form" class="row" hidden>
    <input id="token" type="password" placeholder="Bearer token" autocomplete="off" aria-label="Bearer token">
    <button type="submit">Open</button>
  </form>
  <p id="msg" role="status"></p>
</main>
<script>
(() => {
  "use strict";
  // Same keys as the admin panel and scotri-ui, so a token already given in this tab is reused.
  const KEYS = ["scotri-admin-token", "scotri.devAuthToken"];
  const get = () => { try { for (const k of KEYS) { const v = sessionStorage.getItem(k); if (v) return v; } } catch {} return null; };
  const set = (v) => { try { sessionStorage.setItem(KEYS[0], v); } catch {} };
  const clear = () => { try { KEYS.forEach((k) => sessionStorage.removeItem(k)); } catch {} };
  const $ = (id) => document.getElementById(id);
  const say = (t, bad) => { $("msg").textContent = t; $("msg").className = bad ? "bad" : ""; };
  const ask = () => { $("form").hidden = false; $("token").focus(); };

  async function load(token) {
    say("Loading the map…");
    let res;
    try { res = await fetch("/v1/platform-map", { headers: { Authorization: "Bearer " + token } }); }
    catch { say("The Scotri API didn't answer. Check that it is running, then try again.", true); ask(); return; }
    if (res.status === 401 || res.status === 403) { clear(); say("That token wasn't accepted. Paste a current one.", true); ask(); return; }
    if (!res.ok) {
      let detail = "HTTP " + res.status;
      try { const b = await res.json(); detail = b.detail || b.message || detail; } catch {}
      say(detail, true); ask(); return;
    }
    const html = await res.text();
    document.open(); document.write(html); document.close();
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("token").value.trim().replace(/^bearer\s+/i, "");
    if (!v) return;
    set(v); $("token").value = ""; load(v);
  });
  const t = get();
  if (t) load(t); else ask();
})();
</script>
</body>
</html>
