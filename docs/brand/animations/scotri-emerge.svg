<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-label="Scotri working (emerge)">
  <title>Scotri — working, emerge</title>
  <style>
    .arcs  { transform-box: view-box; transform-origin: 24px 24px; animation: emerge-rotate 6.4s cubic-bezier(.45,0,.55,1) infinite; }
    .draw  { animation: emerge-draw 6.4s cubic-bezier(.45,0,.55,1) infinite; }
    .pupil { transform-box: view-box; transform-origin: 24px 24px; animation: emerge-pupil 6.4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes emerge-rotate { 0%, 22% { transform: rotate(0deg); } 55%, 100% { transform: rotate(180deg); } }
    @keyframes emerge-draw   { 0% { stroke-dashoffset: -100; } 22%, 55% { stroke-dashoffset: 0; } 77%, 100% { stroke-dashoffset: 100; } }
    @keyframes emerge-pupil  { 0%, 77% { transform: scale(1); } 84% { transform: scale(1.35); } 90%, 100% { transform: scale(1); } }
    .ink { stroke: #12151A; } .fill-ink { fill: #12151A; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #F6F4EF; } .fill-ink { fill: #F6F4EF; } }
    @media (prefers-reduced-motion: reduce) { .arcs, .draw, .pupil { animation: none; } }
  </style>
  <g class="arcs">
    <path class="draw ink" pathLength="100" stroke-dasharray="100 100" d="M14.5 16.2 Q 27 7.5 41 24" stroke-width="4" stroke-linecap="round"/>
    <path class="draw ink" pathLength="100" stroke-dasharray="100 100" d="M33.5 31.8 Q 21 40.5 7 24" stroke-width="4" stroke-linecap="round"/>
  </g>
  <circle class="pupil fill-ink" cx="24" cy="24" r="3.6"/>
</svg>
