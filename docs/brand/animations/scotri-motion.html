<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scotri motion states</title>
<link rel="stylesheet" href="scotri-motion.css">
<style>
  body { margin: 0; padding: 40px; background: #F6F4EF; color: #12151A;
         font: 13px/1.5 'IBM Plex Sans', system-ui, sans-serif;
         display: flex; gap: 36px; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 10px; font-size: 11px; letter-spacing: .08em;
               text-transform: uppercase; color: #6B6F76; }
</style>
</head>
<body>

<!-- Each state is the same markup; only the class on the wrapper changes.
     The mark inherits `currentColor`, so it works on light and dark alike. -->

<figure class="scotri-anim scotri-scan">
  <svg viewBox="0 0 48 48" width="64" height="64" fill="none" role="img" aria-label="Working">
    <g class="arcs">
      <path d="M14.5 16.2 Q 27 7.5 41 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path d="M33.5 31.8 Q 21 40.5 7 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle class="pupil" cx="24" cy="24" r="3.6" fill="currentColor"/>
  </svg>
  <figcaption>Scan — working</figcaption>
</figure>

<figure class="scotri-anim scotri-aperture">
  <svg viewBox="0 0 48 48" width="64" height="64" fill="none" role="img" aria-label="Reading">
    <g class="arcs">
      <path pathLength="100" stroke-dasharray="100 100" d="M14.5 16.2 Q 27 7.5 41 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path pathLength="100" stroke-dasharray="100 100" d="M33.5 31.8 Q 21 40.5 7 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle class="pupil" cx="24" cy="24" r="3.6" fill="currentColor"/>
  </svg>
  <figcaption>Aperture — reading</figcaption>
</figure>

<figure class="scotri-anim scotri-heartbeat">
  <svg viewBox="0 0 48 48" width="64" height="64" fill="none" role="img" aria-label="Claim held">
    <g class="arcs">
      <path d="M14.5 16.2 Q 27 7.5 41 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path d="M33.5 31.8 Q 21 40.5 7 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle class="halo" cx="24" cy="24" r="3.6" fill="none" stroke="#2A6F66" stroke-width="1.6"/>
    <circle class="pupil" cx="24" cy="24" r="3.6" fill="currentColor"/>
  </svg>
  <figcaption>Heartbeat — claim held</figcaption>
</figure>

<figure class="scotri-anim scotri-queued">
  <svg viewBox="0 0 48 48" width="64" height="64" fill="none" role="img" aria-label="Queued">
    <g class="arcs">
      <path d="M14.5 16.2 Q 27 7.5 41 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path d="M33.5 31.8 Q 21 40.5 7 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle class="pupil" cx="24" cy="24" r="3.6" fill="currentColor"/>
  </svg>
  <figcaption>Queued — at the governor</figcaption>
</figure>

<figure class="scotri-anim scotri-trace">
  <svg viewBox="0 0 48 48" width="64" height="64" fill="none" role="img" aria-label="Starting">
    <g class="arcs">
      <path pathLength="100" stroke-dasharray="100 100" d="M14.5 16.2 Q 27 7.5 41 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path pathLength="100" stroke-dasharray="100 100" d="M33.5 31.8 Q 21 40.5 7 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle class="pupil" cx="24" cy="24" r="3.6" fill="currentColor"/>
  </svg>
  <figcaption>Trace — boot</figcaption>
</figure>

<figure class="scotri-anim scotri-ring" style="--scotri-progress: .66">
  <svg viewBox="0 0 48 48" width="64" height="64" fill="none" role="img" aria-label="Progress">
    <circle class="ring" cx="24" cy="24" r="21.5" pathLength="100" stroke-dasharray="100 100"
            stroke="#2A6F66" stroke-width="2.4" stroke-linecap="round" transform="rotate(-90 24 24)"/>
    <g class="arcs">
      <path d="M15.8 17.6 Q 26.4 10.1 37.6 23.2" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path d="M32.2 30.4 Q 21.6 37.9 10.4 24.8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle class="pupil" cx="24" cy="24" r="3.4" fill="currentColor"/>
  </svg>
  <figcaption>Ring — N of M</figcaption>
</figure>

<figure class="scotri-anim scotri-settle">
  <svg viewBox="0 0 48 48" width="64" height="64" fill="none" role="img" aria-label="Done">
    <g class="arcs">
      <path d="M14.5 16.2 Q 27 7.5 41 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path d="M33.5 31.8 Q 21 40.5 7 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle class="pupil" cx="24" cy="24" r="3.6" fill="#12151A"/>
  </svg>
  <figcaption>Settle — done</figcaption>
</figure>

</body>
</html>
